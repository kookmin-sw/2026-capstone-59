services:
  db:
    image: postgres:16-alpine
    container_name: poco-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  migrate:
    build: ./backend
    container_name: poco-migrate
    command: alembic upgrade head
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DB_SSL: ${DB_SSL}
    depends_on:
      db:
        condition: service_healthy

  backend-a:
    build: ./backend
    container_name: poco-backend-a
    command: uvicorn app.business.main:app --host 0.0.0.0 --port 8000
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DB_SSL: ${DB_SSL}
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: always

  backend-b:
    build: ./backend
    container_name: poco-backend-b
    command: uvicorn app.ai.main:app --host 0.0.0.0 --port 8001
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DB_SSL: ${DB_SSL}
    expose:
      - "8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: always

  frontend:
    build: ./frontend
    container_name: poco-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend-a
      - backend-b
    restart: always

volumes:
  db_data:
